name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer à la main depuis l'onglet Actions quand une exécution
  # échoue au démarrage côté GitHub et ne peut pas être relancée par l'API.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # There are no dependencies to install: the plugin is a single ESM file
      # and the tests use only the Node standard library.
      - name: Syntax check and unit tests
        run: npm run check
